<h2>投屏稿先定一个方向</h2>
<p class="subtitle">目标：给观众看核心信息，删掉串场话术，用图把主线托住。先选你更想要的成品形态。</p>

<div class="cards">
  <div class="card" data-choice="slide-deck" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">A. 幻灯片式</div>
        <div class="mockup-body">
          <div style="height:22px;width:55%;background:#111827;border-radius:6px;margin-bottom:18px;"></div>
          <div style="display:grid;grid-template-columns:1.1fr 1fr;gap:16px;">
            <div>
              <div style="height:90px;background:#dbeafe;border-radius:12px;margin-bottom:12px;"></div>
              <div style="height:10px;width:85%;background:#93c5fd;border-radius:999px;margin-bottom:8px;"></div>
              <div style="height:10px;width:65%;background:#93c5fd;border-radius:999px;"></div>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;">
              <div style="height:22px;background:#fde68a;border-radius:8px;"></div>
              <div style="height:22px;background:#fde68a;border-radius:8px;"></div>
              <div style="height:22px;background:#fde68a;border-radius:8px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 幻灯片式投屏稿</h3>
      <p>一页一个观点，强视觉、少文字。适合真正投屏讲，后续可转 PPT / Keynote / HTML。</p>
    </div>
  </div>

  <div class="card" data-choice="speaker-board" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">B. 图文讲义式</div>
        <div class="mockup-body">
          <div style="height:18px;width:45%;background:#111827;border-radius:6px;margin-bottom:12px;"></div>
          <div style="height:70px;background:#e0e7ff;border-radius:12px;margin-bottom:12px;"></div>
          <div style="height:9px;width:92%;background:#c7d2fe;border-radius:999px;margin-bottom:7px;"></div>
          <div style="height:9px;width:88%;background:#c7d2fe;border-radius:999px;margin-bottom:7px;"></div>
          <div style="height:9px;width:75%;background:#c7d2fe;border-radius:999px;"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 图文讲义式投屏稿</h3>
      <p>每段保留一小段核心文字 + 图。适合你边看边讲，观众也能跟上，但视觉冲击弱一点。</p>
    </div>
  </div>

  <div class="card" data-choice="timeline-map" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">C. 大图谱式</div>
        <div class="mockup-body">
          <div style="display:flex;align-items:center;gap:8px;margin-top:18px;">
            <div style="width:34px;height:34px;background:#bfdbfe;border-radius:50%;"></div>
            <div style="height:4px;flex:1;background:#94a3b8;"></div>
            <div style="width:34px;height:34px;background:#c7d2fe;border-radius:50%;"></div>
            <div style="height:4px;flex:1;background:#94a3b8;"></div>
            <div style="width:34px;height:34px;background:#fecaca;border-radius:50%;"></div>
            <div style="height:4px;flex:1;background:#94a3b8;"></div>
            <div style="width:34px;height:34px;background:#bbf7d0;border-radius:50%;"></div>
          </div>
          <div style="height:42px;background:#f1f5f9;border-radius:10px;margin-top:22px;"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C. 大图谱式投屏稿</h3>
      <p>围绕总时间轴、闭环图、对照图讲完整场。整体感最强，但需要更多图形设计。</p>
    </div>
  </div>
</div>
